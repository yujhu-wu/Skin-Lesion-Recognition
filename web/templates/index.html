<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skin Detection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
        }

        .container {
            background-color: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #333;
        }

        label {
            display: block;
            font-size: 1.1em;
            margin-bottom: 10px;
            color: #555;
        }

        input[type="file"] {
            margin: 10px 0;
            display: block;
            text-align: center;
            width: 100%;
            max-width: 250px;
            margin: 0 auto;
            background: linear-gradient(135deg, #e0e0e0, #b0b0b0);
            color: black;
            border-radius: 2px;
            font-size: 1em;
        }

        button {
            padding: 12px 24px;
            background-color: #73b0f0;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            width: 40%;
        }

        button:hover {
            background-color: #1e4774;
        }

        button:disabled {
            background-color: #ccc;
        }

        .hidden {
            display: none;
        }

        #video,
        #canvas {
            width: 48%;
            margin: 10px 1%;
        }

        #snapButton,
        #retakeButton {
            width: 48%;
            margin: 10px 1%;
        }

        #uploadButton {
            padding: 12px 24px;
            background-color: #ccc;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: not-allowed; /* 禁用時顯示不允許的游標 */
            transition: background-color 0.3s ease;
            margin-top: 10px;
            width: 40%;
        }

        #uploadButton:not(:disabled) {
            background-color: #dec251;
            cursor: pointer; /* 啟用時顯示點擊手型 */
        }

        #uploadButton:hover:not(:disabled) {
            background-color: #c39d3d;
        }

        #imagePreview {
            margin-top: 20px;
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 200px;
        }

        .error-message {
            color: rgb(177, 4, 4);
            font-size: 0.9em;
            margin-top: 10px;
        }
        .notice {
            padding: 0.2px;
            border-radius: 8px;
            background-color: #fadede;
            color: rgb(112, 9, 9);
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Upload an Image for Skin Detection</h1>
        <form id="uploadForm" method="post" enctype="multipart/form-data">
            <label for="fileInput">Choose an image file:</label>         
            <input type="file" id="fileInput" name="file" accept="image/*" required>
            <br>
            <img id="imagePreview" class="hidden" alt="Image Preview">
            <div id="error-message" class="error-message hidden">Please upload an image file.</div>
            <br><br>
            <button type="button" id="captureButton" aria-label="Capture photo using camera">Capture Photo</button>
            <br><br>
            <button type="submit" id="uploadButton" disabled>Upload</button>
            <div class="notice">
                <p>此網站結果僅供參考，如有任何不適請盡速就醫，並謹遵醫囑。</p>
            </div>   
        </form>

        <!-- Camera preview -->
        <div id="cameraPreview" class="hidden">
            <video id="video" width="320" height="240" autoplay></video>
            <canvas id="canvas" width="320" height="240" class="hidden"></canvas>
            <br>
            <button type="button" id="switchCameraButton" class="hidden">
                <i class="fas fa-exchange-alt"></i>
            </button>
            <button id="snapButton" aria-label="Take photo">Take Photo</button>
            <button id="retakeButton" class="hidden" aria-label="Retake photo">Retake Photo</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('fileInput');
            const captureButton = document.getElementById('captureButton');
            const switchCameraButton = document.getElementById('switchCameraButton');
            const cameraPreview = document.getElementById('cameraPreview');
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const snapButton = document.getElementById('snapButton');
            const retakeButton = document.getElementById('retakeButton');
            const uploadButton = document.getElementById('uploadButton');
            const imagePreview = document.getElementById('imagePreview');
            const errorMessage = document.getElementById('error-message');

            let stream;
            let currentCamera = 'user'; // 默認為前置鏡頭

            // Toggle camera preview and file input
            captureButton.addEventListener('click', () => {
                if (cameraPreview.classList.contains('hidden')) {
                    cameraPreview.classList.remove('hidden'); // Show camera preview
                    startCamera();
                    captureButton.textContent = "Close Camera"; // Change button text
                    captureButton.style.backgroundColor = "#8c1717"; // Change button color
                } else {
                    stopCamera(); // Stop the camera
                    cameraPreview.classList.add('hidden'); // Hide camera preview
                    captureButton.textContent = "Capture Photo"; // Reset button text
                    captureButton.style.backgroundColor = "#73b0f0"; // Reset button color
                }
            });

            // Start the camera
            function startCamera() {
                navigator.mediaDevices.getUserMedia({ video: { facingMode: currentCamera } })
                    .then((mediaStream) => {
                        stream = mediaStream;
                        video.srcObject = mediaStream;
                        video.classList.remove('hidden');
                        canvas.classList.add('hidden');
                        snapButton.classList.remove('hidden');
                        retakeButton.classList.add('hidden');
                        switchCameraButton.classList.remove('hidden'); // Show switch camera button
                    })
                    .catch((err) => {
                        console.error("Error accessing camera: ", err);
                    });
            }

            // Stop the camera
            function stopCamera() {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                video.classList.add('hidden'); // Hide video preview
                canvas.classList.add('hidden'); // Hide captured image on canvas
                snapButton.classList.add('hidden'); // Hide Take Photo button
                retakeButton.classList.add('hidden'); // Hide Retake Photo button
                switchCameraButton.classList.add('hidden'); // Hide switch camera button
            }

            // Switch between front and back camera
            switchCameraButton.addEventListener('click', () => {
                currentCamera = (currentCamera === 'user') ? 'environment' : 'user'; // Toggle camera
                stopCamera(); // Stop current camera
                startCamera(); // Start new camera
            });

            // Take photo
            snapButton.addEventListener('click', () => {
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                video.classList.add('hidden'); // Hide video preview
                canvas.classList.remove('hidden'); // Show captured image on canvas
                snapButton.classList.add('hidden'); // Hide Take Photo button
                retakeButton.classList.remove('hidden'); // Show Retake Photo button
                uploadButton.disabled = false; // Enable the upload button after taking a photo
            });

            // Retake photo
            retakeButton.addEventListener('click', () => {
                video.classList.remove('hidden'); // Show video preview
                canvas.classList.add('hidden'); // Hide captured image on canvas
                snapButton.classList.remove('hidden'); // Show Take Photo button
                retakeButton.classList.add('hidden'); // Hide Retake Photo button
            });

            // Display image preview and handle upload button state
            fileInput.addEventListener('change', () => {
                const file = fileInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        imagePreview.src = e.target.result;
                        imagePreview.classList.remove('hidden');
                        uploadButton.disabled = false; // Enable the upload button
                        errorMessage.classList.add('hidden'); // Hide error message
                    };
                    reader.readAsDataURL(file);
                } else {
                    imagePreview.classList.add('hidden');
                    uploadButton.disabled = true; // Disable the upload button
                    errorMessage.classList.remove('hidden'); // Show error message
                }
            });

            // Upload the image
            uploadButton.addEventListener('click', () => {
                const context = canvas.getContext('2d');
                canvas.toBlob((blob) => {
                    const file = new File([blob], 'captured-image.png', { type: 'image/png' });
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    fileInput.files = dataTransfer.files; // Set the captured image as the file input value
                    fileInput.style.display = 'block'; // Show file input again
                    // Optionally, you can show the image preview after capturing
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        imagePreview.src = e.target.result;
                        imagePreview.classList.remove('hidden');
                    };
                    reader.readAsDataURL(blob); // Read the blob to display the preview
                }, 'image/png');
            });
        });
    </script>
</body>

</html>
