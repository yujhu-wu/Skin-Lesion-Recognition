<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片分类器</title>
</head>

<body>
    <h1>上传一张图片进行分类</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*">
        <button type="submit">分类图片</button>
    </form>

    {% if prediction %}
    <h2>预测结果: {{ prediction }}</h2>
    {% endif %}
</body>

</html>
